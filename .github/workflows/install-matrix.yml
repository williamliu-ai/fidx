name: install-matrix

# Proves a clean install + ~1k-doc e2e benchmark on every supported triple:
# linux-x86_64 (ubuntu), windows-x86_64 (windows), macos-arm64 (macos-15).
# Build the wheel ONCE, then install THAT artifact from scratch on each cell and
# run `fidx doctor` + scripts/e2e_smoke.py against the installed CLI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash            # bash on all runners so globbing/paths are uniform
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fidxcache
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4          # scripts/ + tests/fixtures/
      # Base Python: setup-python on linux/windows (its sqlite3 loads extensions);
      # Homebrew Python on macOS, because uv/python-build-standalone and python.org
      # macOS builds ship sqlite3 WITHOUT loadable-extension support.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os != 'macOS'
        with:
          python-version: ${{ matrix.python }}
      - name: Homebrew Python (macOS sqlite extension support)
        if: runner.os == 'macOS'
        run: brew install python@${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: create venv + install wheel (binary only)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BASE="$(brew --prefix python@${{ matrix.python }})/libexec/bin/python"
          else
            BASE=python
          fi
          "$BASE" -m venv .venv
          if [ -f .venv/bin/python ]; then VPY=.venv/bin/python; VBIN=.venv/bin; else VPY=.venv/Scripts/python; VBIN=.venv/Scripts; fi
          "$VPY" -m pip install --upgrade pip >/dev/null
          "$VPY" -m pip install --only-binary=:all: dist/*.whl
          echo "VPY=$VPY" >> "$GITHUB_ENV"
          echo "VBIN=$VBIN" >> "$GITHUB_ENV"
      - name: arch sanity (macos-15 must be arm64)
        if: matrix.os == 'macos-15'
        run: |
          "$VPY" -c "import platform,sys; m=platform.machine(); sys.exit(0 if m=='arm64' else 'expected arm64, got '+m)"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fidx-model-e5-768-${{ runner.os }}-v1
      - name: fidx doctor (installed console script)
        run: |
          export PATH="$VBIN:$PATH"
          fidx doctor
      - name: e2e benchmark (~1k docs, installed wheel)
        run: |
          "$VPY" scripts/e2e_smoke.py --docs 1000 --queries 40 --expect-sha 0c44103f9ebb89b9f0504010acb9a37fd7f4d40e8c34b2e61b364164fbce2dac

  install-rerank:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_XET: "1"
      FIDX_PROFILE: nomic-768-q
    steps:
      # The rerank cells consume the build job's wheel in a fresh venv. No
      # source checkout or shared embedding-model cache is needed.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os != 'macOS'
        with:
          python-version: ${{ matrix.python }}
      - name: Homebrew Python (macOS sqlite extension support)
        if: runner.os == 'macOS'
        run: brew install python@${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: create venv + install rerank extra (binary only)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BASE="$(brew --prefix python@${{ matrix.python }})/libexec/bin/python"
          else
            BASE=python
          fi
          "$BASE" -m venv .venv
          if [ -f .venv/bin/python ]; then VPY=.venv/bin/python; VBIN=.venv/bin; else VPY=.venv/Scripts/python; VBIN=.venv/Scripts; fi
          set -- dist/*.whl
          test "$#" -eq 1
          "$VPY" -m pip install --only-binary=:all: "${1}[rerank]"
          echo "VPY=$VPY" >> "$GITHUB_ENV"
          echo "VBIN=$VBIN" >> "$GITHUB_ENV"
      - name: arch sanity (macos-15 must be arm64)
        if: matrix.os == 'macos-15'
        run: |
          "$VPY" -c "import platform,sys; m=platform.machine(); sys.exit(0 if m=='arm64' else 'expected arm64, got '+m)"
      - name: installed cross-encoder and soft doctor rows (no model fetch)
        env:
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fidx-rerank-empty-cache
          HF_HOME: ${{ runner.temp }}/fidx-rerank-hf
        run: |
          export PATH="$VBIN:$PATH"
          fidx doctor --json > "$RUNNER_TEMP/fidx-rerank-doctor.json"
          "$VPY" - <<'PY'
          import inspect
          import json
          import os
          import sysconfig
          from importlib import metadata
          from pathlib import Path
          from fastembed.rerank.cross_encoder import TextCrossEncoder

          version = metadata.version("fastembed")
          assert version.startswith(("0.8.", "0.9.")), version
          assert TextCrossEncoder.__module__.startswith("fastembed.rerank.cross_encoder.")
          origin = Path(inspect.getfile(TextCrossEncoder)).resolve()
          site_packages = [Path(sysconfig.get_path(key)).resolve()
                           for key in ("purelib", "platlib")]
          assert any(origin.is_relative_to(root) for root in site_packages), (
              origin, site_packages)
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "fidx-rerank-doctor.json").read_text(encoding="utf-8"))
          assert report["schema"] == "fidx.doctor.v1" and report["ok"] is True
          checks = {row["name"]: row for row in report["checks"]}
          assert checks["rerank_capability"]["ok"] is True
          assert checks["rerank_model"]["ok"] is False
          assert checks["rerank_model"]["hard"] is False
          cache = Path(os.environ["FASTEMBED_CACHE_PATH"])
          assert not any(path.is_file() for path in cache.rglob("*")), cache
          print(f"installed FastEmbed {version} cross-encoder at {origin}; model cache empty")
          PY

  install-mcp:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os != 'macOS'
        with:
          python-version: ${{ matrix.python }}
      - name: Homebrew Python (macOS sqlite extension support)
        if: runner.os == 'macOS'
        run: brew install python@${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: create venv + install MCP extra (binary only)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BASE="$(brew --prefix python@${{ matrix.python }})/libexec/bin/python"
          else
            BASE=python
          fi
          "$BASE" -m venv .venv
          if [ -f .venv/bin/python ]; then VPY=.venv/bin/python; else VPY=.venv/Scripts/python; fi
          set -- dist/*.whl
          test "$#" -eq 1
          "$VPY" -m pip install --only-binary=:all: "${1}[mcp]"
          echo "VPY=$VPY" >> "$GITHUB_ENV"
      - name: installed offline stdio checks (disposable environment)
        run: '"$VPY" tests/test_mcp_offline.py --installed'
