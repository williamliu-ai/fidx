name: release

# Trusted-publishing release. Fires on an annotated v* tag. Builds the dist ONCE,
# verifies the tag matches the package version, runs the install+e2e check on that
# exact artifact, then publishes the SAME files to TestPyPI and PyPI via OIDC
# (no tokens). Maintainer setup required before the first release: choose the
# distribution name (`fidx` is taken on PyPI), set [project].name accordingly, and
# register both trusted publishers on PyPI/TestPyPI for this repo + workflow +
# environments.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: build
        run: uv build
      - name: tag must match package version (v-stripped)
        run: |
          ver=$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3.*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          echo "wheel version=$ver tag=$tag"
          test "$ver" = "$tag"
      - run: uvx twine check dist/*
      - name: pip-audit (blocking at release time)
        run: |
          uv export --locked --no-emit-project --format requirements-txt -o /tmp/reqs.txt
          uvx pip-audit -r /tmp/reqs.txt $(grep -Ev '^(#|$)' .github/pip-audit-ignore.txt | sed 's/^/--ignore-vuln /')
      - name: install + e2e on the exact artifact
        run: |
          python -m venv .venv && . .venv/bin/activate
          pip install --only-binary=:all: dist/*.whl
          fidx doctor
          python scripts/e2e_smoke.py --docs 1000 --queries 40 \
            --expect-sha 0c44103f9ebb89b9f0504010acb9a37fd7f4d40e8c34b2e61b364164fbce2dac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest          # the publish action is container-based (Linux)
    environment: testpypi
    permissions:
      id-token: write               # OIDC, only on the publish job
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
